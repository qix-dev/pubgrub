[package]
name = "pubgrub-go-reference"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
pubgrub = { package = "astral-pubgrub", path = "../../../pubgrub", features = ["serde"] }
version-ranges = { package = "astral-version-ranges", path = "../../../pubgrub/version-ranges", features = ["serde", "semver"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
